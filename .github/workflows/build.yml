name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - '*.*.*'
      - 'v*.*.*'

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
    
    - name: Make Windows happy
      if: matrix.os == 'windows-latest'
      run: |
        C:\Users\runneradmin\AppData\Roaming\Python\Scripts\poetry build
    
    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_OUTPUT

    - name: Build artifacts
      if: matrix.os != 'windows-latest'
      run: |
        poetry build

    - name: Store artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
        path: |
          dist/*.whl
          dist/*.tar.gz
        if-no-files-found: error

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          dist/*.whl
          dist/*.tar.gz
        body: |
          ## Release ${{steps.date.outputs.date}}
          **Warning:** This is an automated release. Please test before using it.
          - OS Version: ${{ matrix.os }}
          - Python Version: ${{ matrix.python-version }}
          - Build at: ${{steps.date.outputs.date}}
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}